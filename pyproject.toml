[project]
name = "finance-rag-assistant"
version = "0.1.0"
description = "A Retrieval-Augmented Generation (RAG) system for answering financial questions using SEC 10-K filings."
authors = [ {name = "Min Htoo Lin",email = "linmin.htoo@gmail.com"} ]
keywords = ["rag", "llm", "langchain", "faiss", "finance", "ollama"]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "sentence-transformers>=2.7.0",

    # NOTE: poetry refuses to install faiss-gpu, why?
    # must we use conda?
    # `conda install -c pytorch -c nvidia faiss-gpu=1.12.0`
    "faiss-cpu",

    "streamlit",
    "pydantic>=2.0",
    "tiktoken",
    "unstructured[all-docs]",
    "pypdf",
    "flagembedding",
    "ragas",
    "datasets",
    "fastapi",
    "uvicorn",
    "httpx",
    "tenacity",
    "loguru",
    "readability-lxml (>=0.8.4.1,<0.9.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "jq (>=1.10.0,<2.0.0)",
    "langchain-huggingface (>=1.0.0,<2.0.0)",
    "flashrank (>=0.2.10,<0.3.0)",
    "langchain-ollama (>=1.0.0,<2.0.0)",
    "langchain-core (>=1.0.0,<2.0.0)",
]

[tool.poetry]
package-mode = false
packages = [{ include = "finance_rag_assistant", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "ruff (>=0.14.1,<0.15.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"


[tool.ruff]
line-length = 120
target-version = "py312"
# Lint rules: E (pycodestyle), F (pyflakes), I (isort)
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
# Match your previous Black preferences
line-ending = "lf"
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

# [mypy-tests.*]
# Allow looser typing in tests
# disallow_untyped_defs = false
# check_untyped_defs = false
